      <path d="M0,-64 L6.5,-85 L0,-111 L-6.5,-85 Z"/>
      <path d="M11,-84.7 L23.3,-84.8 L28.8,-95.8 L16.5,-95.8 Z"/>
      <path d="M-11,-84.7 L-23.3,-84.8 L-28.8,-95.8 L-16.5,-95.8 Z"/>
      <path d="M7.4,-100.1 L15.0,-100.2 L18.4,-107.0 L10.8,-106.9 Z"/>
