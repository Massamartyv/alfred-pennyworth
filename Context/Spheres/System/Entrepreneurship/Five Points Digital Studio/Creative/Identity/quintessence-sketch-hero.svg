  <title>The Quintessence - construction sketch</title>
  <desc>Five-fold faceted snowflake, seamed single form. Spine of 47 units in descending Fibonacci segments 21, 13 and 13. Approved founder reference, 18 July 2026. Sketch tolerance; the commission brief constants govern where sketch and law diverge.</desc>
