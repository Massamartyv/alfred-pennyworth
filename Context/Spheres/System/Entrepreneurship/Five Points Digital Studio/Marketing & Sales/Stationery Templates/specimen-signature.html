<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="trim" content="screen">
<title>Signature specimen – Five Points Digital Studio</title>
<link rel="stylesheet" href="stationery.css">
<style>
/* Specimen instance of signature.html, set for the partner. Building this
   file writes specimen-signature.built.html, which is the block pasted into
   the mail client - after the mark src is swapped for a hosted absolute URL.
   No telephone line, by the same reasoning as the card. */

.stage { padding: 28px 32px; background: var(--bone-100); }
.stage .note {
  margin-bottom: 18px;
  font-family: var(--font-mono);
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: var(--track-mono);
  color: var(--warm-600);
}
</style>
</head>
<body data-voice="coral">

<section class="sheet stage">

  <div class="note">Deliverable: build.py flattens the marked block to specimen-signature.built.html</div>

  <!-- ===== SIGNATURE START ================================================ -->
  <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
    <tr>
      <td style="padding:0 14px 0 0;vertical-align:top;">
        <img src="assets/mark-40.png" width="40" height="40" alt="Five Points" style="display:block;border:0;">
      </td>
      <td style="vertical-align:top;">
        <div style="font-family:var(--font-mail);font-size:14px;font-weight:bold;color:var(--ink-900);line-height:1.4;">Martavious Spicer</div>
        <div style="font-family:var(--font-mail);font-size:12px;color:var(--warm-600);line-height:1.4;">Partner</div>
        <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:9px;border-top:1px solid var(--bone-400);">
          <tr>
            <td style="padding:8px 28px 0 0;vertical-align:top;">
              <div style="font-family:var(--font-mail);font-size:12px;color:var(--ink-900);line-height:1.5;">martavious@fivepoints.studio</div>
              <div style="font-family:var(--font-mail);font-size:12px;color:var(--warm-600);line-height:1.5;">fivepoints.studio</div>
            </td>
            <td style="padding:8px 0 0 0;vertical-align:top;">
              <div style="font-family:var(--font-mail);font-size:11px;font-weight:bold;color:var(--voice);line-height:1.6;">Five Points Digital Studio</div>
              <div style="font-family:var(--font-mail);font-size:11px;color:var(--warm-600);line-height:1.6;">Decatur, Georgia</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  <!-- ===== SIGNATURE END ================================================== -->

</section>

</body>
</html>
