<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="trim" content="screen">
<title>Email Signature – Five Points Digital Studio</title>
<link rel="stylesheet" href="stationery.css">
<style>
/* ==========================================================================
   EMAIL SIGNATURE – screen trim, no PDF

   The Bayport pass, operator-directed 2026-08-06: the signature is the
   letterhead compressed. The masthead above - the mark in its column, the
   person on the axis - and the letterhead's two-column metadata foot below
   a single rule: reach on the left, house and place on the right. One
   architecture at every scale, which is the point of having one.

   The one artefact of the suite that ships as markup rather than paper, and
   the one that cannot be handed to a mail client as written. Two
   constraints govern it, and the build resolves both rather than the source
   compromising for them:

   1. Mail clients strip <style> blocks. Every rule that must survive is
      therefore written inline on the element, and the layout is nested
      tables because that is the only box model mail clients agree on.
   2. Mail clients cannot resolve custom properties or webfonts. So the
      inline rules are written against the token sheet - var(--voice),
      var(--font-mail) - and build.py flattens them to literal values on the
      way out, writing signature.built.html. That generated file is the
      deliverable pasted into the client.

   The consequence worth knowing: this source names no hue and no face
   directly, so it obeys the voice contract like every other artefact.
   Change data-voice, rebuild, and the signature follows. Never hand-edit
   the generated file; it is overwritten on every build.

   THE MARK MUST BE HOSTED. The src below is a local path, which is correct
   for the proof and wrong for a live signature: a relative path breaks the
   moment the block leaves this folder, and most clients will not embed a
   local file on paste. Before the signature goes into anyone's mail client,
   replace the src with an absolute https URL on the studio domain. This is
   the last mile and it is not yet built.

   Forbidden on this artefact, per the fingerprint: pronouns, quotations,
   "sent from" banners, taglines, booking links and disclaimers of any kind.
   The signature carries the person and the house. Nothing else.
   ========================================================================== */

.stage {
  padding: 28px 32px;
  background: var(--bone-100);
}
.stage .note {
  margin-bottom: 18px;
  font-family: var(--font-mono);
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: var(--track-mono);
  color: var(--warm-600);
}
</style>
</head>
<body data-voice="coral">

<section class="sheet stage">

  <div class="note">Deliverable: build.py flattens the marked block to signature.built.html</div>

  <!-- ===== SIGNATURE START ================================================ -->
  <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
    <tr>
      <td style="padding:0 14px 0 0;vertical-align:top;">
        <img src="assets/mark-40.png" width="40" height="40" alt="Five Points" style="display:block;border:0;">
      </td>
      <td style="vertical-align:top;">
        <div style="font-family:var(--font-mail);font-size:14px;font-weight:bold;color:var(--ink-900);line-height:1.4;">«NAME»</div>
        <div style="font-family:var(--font-mail);font-size:12px;color:var(--warm-600);line-height:1.4;">«TITLE»</div>
        <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:9px;border-top:1px solid var(--bone-400);">
          <tr>
            <td style="padding:8px 28px 0 0;vertical-align:top;">
              <div style="font-family:var(--font-mail);font-size:12px;color:var(--ink-900);line-height:1.5;">«EMAIL»</div>
              <div style="font-family:var(--font-mail);font-size:12px;color:var(--warm-600);line-height:1.5;">fivepoints.studio</div>
            </td>
            <td style="padding:8px 0 0 0;vertical-align:top;">
              <div style="font-family:var(--font-mail);font-size:11px;font-weight:bold;color:var(--voice);line-height:1.6;">Five Points Digital Studio</div>
              <div style="font-family:var(--font-mail);font-size:11px;color:var(--warm-600);line-height:1.6;">Decatur, Georgia</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  <!-- ===== SIGNATURE END ================================================== -->

</section>

</body>
</html>
